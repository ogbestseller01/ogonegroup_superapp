name: fundiapp_sdk
description: "Fundi App – connect with trusted technicians, manage services, posts, portfolio and requests."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0" # Aligned with root app

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── UI & Styling ────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  toastification: ^2.3.0
  font_awesome_flutter: ^10.8.0 # Changed from git to match root

  # ── Media & Files ───────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^7.1.1 # Aligned
  audioplayers: ^6.0.0
  emoji_picker_flutter: ^4.4.0 # Aligned
  file_picker: ^10.3.10 # Aligned
  open_file: ^4.0.0 # Aligned
  path_provider: ^2.1.4
  country_flags: ^4.1.2
  gallery_saver_plus: ^3.0.0
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^11.0.0 # Aligned
  video_player: ^2.10.1

  # ── YouTube & Browser ───────────────────────────────────
  youtube_player_flutter: ^9.0.1
  url_launcher: ^6.3.0

  # ── State & Network ─────────────────────────────────────
  provider: ^6.1.2
  dio: ^5.7.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  flutter_cache_manager: ^3.4.1
  sensors_plus: ^6.1.2

  # ── Firebase & Notifications ────────────────────────────
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^19.0.0
  flutter_app_badger_plus: ^1.0.0 # Changed from app_badge_plus to match root

  # ── Device ──────────────────────────────────────────────
  geolocator: ^13.0.1
  permission_handler: ^12.0.3 # Aligned
  connectivity_plus: ^7.2.0 # Aligned

  # ── Maps ────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── QR Scanner ──────────────────────────────────────────
  qr_code_scanner_plus: ^2.0.10
  camera: ^0.11.0+2
  # REMOVED: google_mlkit_face_detection

  # ── Biometric Auth (Face + Fingerprint) ─────────────────
  biometric_security: ^0.1.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

# REMOVED: dependency_overrides (let the root app handle them)

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/nearbyfundi-logov1.png"
  adaptive_icon_background: "#eaf1fb"
  adaptive_icon_foreground: "assets/icons/nearbyfundi-logov1.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  ios_content_mode: center
