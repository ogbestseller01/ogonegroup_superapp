name: og_one_super
description: OG ONE GROUP Super App - Mini Apps Launcher
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^6.3.3
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # HTTP client for the static pages API (About, Terms, Privacy, FAQs, Contact)
  dio: ^5.7.0

  # Open email, website, phone dialer and WhatsApp from the Contact screen
  url_launcher: ^6.3.0

  firebase_core: ^4.15.0

  fundiapp_sdk:
    path: packages/fundiapp
  nearbyfundi_sdk:
    path: packages/nearby_fundi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/homeimg.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/homeimg.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  # FIX: Moved under 'config' subsection
  config:
    enable-swift-package-manager: false

dependency_overrides:
  # Shared newer versions so both mini-apps can coexist
  file_picker: ^10.3.10
  flutter_local_notifications: ^19.4.1
  share_plus: ^11.0.0
  permission_handler: ^12.0.3
  open_file: ^4.0.0
  connectivity_plus: ^7.2.0
  emoji_picker_flutter: ^4.4.0
  font_awesome_flutter: ^10.8.0
  path_provider: ^2.1.4

  # ===== record family – MUST stay in sync =====
  record: ^7.1.1
  record_platform_interface: ^2.1.0
  record_linux: ^2.1.0
  record_android: ^2.2.0
  record_ios: ^2.0.0
  record_web: ^2.1.0
  record_windows: ^2.3.0
  record_macos: ^2.0.0