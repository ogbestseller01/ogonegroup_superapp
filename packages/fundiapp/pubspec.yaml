name: fundiapp_sdk
description: "Fundi App – connect with trusted technicians, manage services, posts, portfolio and requests."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── UI & Styling ────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  toastification: ^2.3.0
  font_awesome_flutter:
    git:
      url: https://github.com/fluttercommunity/font_awesome_flutter.git
      ref: master

  # ── Media & Files ───────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^5.1.2
  audioplayers: ^6.0.0
  emoji_picker_flutter: ^3.0.0
  file_picker: ^8.1.2
  open_file: ^3.3.2
  path_provider: ^2.1.4
  country_flags: ^4.1.2
  gallery_saver_plus: ^3.0.0
  # country_flags: ^4.1.2   # no longer needed — flags are local PNGs
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^10.0.0

  # ── YouTube & Browser ───────────────────────────────────
  youtube_player_flutter: ^9.0.1
  url_launcher: ^6.3.0

  # ── State & Network ─────────────────────────────────────
  provider: ^6.1.2
  dio: ^5.7.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  flutter_cache_manager: ^3.4.1

  # ── Firebase & Notifications ────────────────────────────
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # v19 uses the POSITIONAL API for initialize() and show().
  # (Named parameters only arrive in v20+.)
  flutter_local_notifications: ^19.0.0

  # ── Badge ───────────────────────────────────────────────
  # iOS: native UIApplication badge API via app_badge_plus.
  # Android: handled through the custom MethodChannel
  #          'com.nearbyfundi/badge' (implemented natively).
  app_badge_plus: ^1.0.0

  # ── Device ──────────────────────────────────────────────
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5

  # ── Maps ────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── QR Scanner ──────────────────────────────────────────
  qr_code_scanner_plus: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  record_linux: ^1.2.0
  record_platform_interface: ^1.2.0

# ============================================================
#  FLUTTER
# ============================================================
flutter:
  generate: true
  uses-material-design: true

  # ── Assets ───────────────────────────────────────────────
  # Folder globs pick up everything inside; the listing below
  # is documentation for future readers.
  #
  # Contents of assets/images/ as of today:
  #   • backing.jpg               — home hero
  #   • englishflug.png           — 🇬🇧 flag used in Settings → Language
  #   • home.jpg                  — home illustration
  #   • nearbyfundi-logov1.png    — legacy logo (splash, icon source)
  #   • tzflug.png                — 🇹🇿 flag used in Settings → Language
  #   • fundiapp-logo.png         — brand logo on login
  #
  # Contents of assets/icons/:
  #   • nearbyfundi-logov1.png    — launcher icon source
  assets:
    - assets/icons/
    - assets/images/

# ============================================================
#  LAUNCHER ICONS — Android & iOS
# ============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/nearbyfundi-logov1.png"
  adaptive_icon_background: "#eaf1fb"
  adaptive_icon_foreground: "assets/icons/nearbyfundi-logov1.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  ios_content_mode: center
